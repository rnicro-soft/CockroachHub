    <!-- JSON-LD: FAQPage for legal rights (AI extracts Q&A) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What are my rights if detained by police in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Under Article 22(2) of the Constitution and BNSS Section 176, you must be produced before a magistrate within 24 hours. You have the right to remain silent (Article 20(3)), the right to inform a family member (BNSS Section 36), and the right to free legal aid (NALSA helpline: 15100)."
          }
        },
        {
          "@type": "Question",
          "name": "What to do if tear gassed during a protest?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Move to higher ground, cover nose and mouth with a wet cloth, flush eyes with cool water for 10-15 minutes, do not rub eyes, remove contaminated clothing, take a cold shower for 20 minutes. Seek medical help if symptoms persist beyond 30 minutes."
          }
        },
        {
          "@type": "Question",
          "name": "How to get free legal aid if arrested in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Call NALSA helpline 15100 for free legal aid. Legal aid is a constitutional right under Article 39A and BNSS Section 386. District Legal Services Authorities provide free lawyers at every district court."
          }
        },
        {
          "@type": "Question",
          "name": "What emergency numbers should I save for Delhi protests?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Police: 100, Ambulance: 108, NHRC: 14440, NALSA Legal Aid: 15100, Women's Helpline: 181, Child Helpline: 1098, AILAJ Legal Aid (Delhi): 93542 31296, PUCL (Delhi): 84476 73005."
          }
        }
      ]
    }
    </script>

    <!-- JSON-LD: HowTo for first aid -->

      "description": "Step-by-step first aid for tear gas exposure during protests.",
      "step": [
        { "@type": "HowToStep", "position": 1, "text": "Move to higher ground immediately — tear gas settles lower." },
        { "@type": "HowToStep", "position": 2, "text": "Cover your nose and mouth with a wet cloth. Do not use oil-based products." },
        { "@type": "HowToStep", "position": 3, "text": "Flush eyes with cool water for 10-15 minutes. Do not rub eyes." },
        { "@type": "HowToStep", "position": 4, "text": "Remove contaminated clothing. Store in sealed bag for 48 hours before washing." },
        { "@type": "HowToStep", "position": 5, "text": "Take a cold shower for 20 minutes. Wash hair thoroughly." },
        { "@type": "HowToStep", "position": 6, "text": "Seek medical help if symptoms persist beyond 30 minutes." }
