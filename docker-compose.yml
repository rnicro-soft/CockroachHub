services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: helpline
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
